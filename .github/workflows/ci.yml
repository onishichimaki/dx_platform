name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'docs/**'
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: Restore
        run: dotnet restore DxPlatform.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all

      - name: Dependency vulnerability report
        run: dotnet list DxPlatform.slnx package --vulnerable --include-transitive

      - name: Build
        run: dotnet build DxPlatform.slnx -c Release --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/DxPlatform.UnitTests/DxPlatform.UnitTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory artifacts/test-results/unit

      - name: Integration tests
        run: >
          dotnet test tests/DxPlatform.IntegrationTests/DxPlatform.IntegrationTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory artifacts/test-results/integration

      - name: Verify EF model matches migrations
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/DxPlatform.Infrastructure --startup-project src/DxPlatform.Web --configuration Release --no-build

      - name: Build company package
        shell: pwsh
        run: ./scripts/build-company-package.ps1 -Version "0.1.0-ci-${{ github.run_number }}" -NoRestore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error

      - name: Upload publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: dx-platform-company-package
          path: artifacts/company/release/*
          if-no-files-found: error
