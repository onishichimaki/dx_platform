name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'docs/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: Restore
        run: dotnet restore DxPlatform.slnx

      - name: Build
        run: dotnet build DxPlatform.slnx -c Release --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/DxPlatform.UnitTests/DxPlatform.UnitTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory artifacts/test-results/unit

      - name: Integration tests
        run: >
          dotnet test tests/DxPlatform.IntegrationTests/DxPlatform.IntegrationTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory artifacts/test-results/integration

      - name: Publish
        run: >
          dotnet publish src/DxPlatform.Web/DxPlatform.Web.csproj
          -c Release --no-restore
          -o artifacts/publish

      - name: Create ZIP artifact
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/dx-platform.zip -Force

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error

      - name: Upload publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: dx-platform-publish
          path: artifacts/dx-platform.zip
          if-no-files-found: error

