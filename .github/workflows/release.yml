name: Release candidate package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Package version without the leading v
        required: true
        default: 0.1.0-rc1

permissions:
  contents: write

jobs:
  verify-package-release:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') {
            '${{ github.ref_name }}'.TrimStart('v')
          } else {
            '${{ inputs.version }}'
          }
          if ($version -notmatch '^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$') {
            throw 'Invalid release version.'
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Restore and audit
        run: dotnet restore DxPlatform.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all

      - name: Build and test
        run: |
          dotnet build DxPlatform.slnx -c Release --no-restore
          dotnet test DxPlatform.slnx -c Release --no-build

      - name: Verify migrations
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/DxPlatform.Infrastructure --startup-project src/DxPlatform.Web --configuration Release --no-build

      - name: Build release package
        shell: pwsh
        run: ./scripts/build-company-package.ps1 -Version '${{ steps.version.outputs.value }}' -NoRestore

      - name: Upload verified package
        uses: actions/upload-artifact@v7
        with:
          name: dx-platform-company-${{ steps.version.outputs.value }}
          path: artifacts/company/release/*
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem artifacts/company/release -File | ForEach-Object FullName
          gh release create '${{ github.ref_name }}' $assets `
            --verify-tag `
            --prerelease `
            --generate-notes `
            --title 'DX共通アプリ基盤 ${{ github.ref_name }}'
